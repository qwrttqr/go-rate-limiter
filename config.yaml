configuration:
  store: "in_memory"
  identify_clients_by:
    - type: authorization_header
      format: jwt
    - type: session_cookie
      cookie_name: session_id
    - type: ip
      version: ipv4
  use_algo: "token_bucket"
  algo_settings:
    capacity: 100
    rate: 20 # Per second
