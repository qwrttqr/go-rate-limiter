services:
  redis:
    image: redis:latest
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
  app:
    build: .
    container_name: rate-limiter
    ports:
      - "8080:8080"
    depends_on:
      - redis

volumes:
  redis_data: